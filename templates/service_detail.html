{% extends "base.html" %}

{% block title %}{{ service.name }} | Nexa Salon{% endblock %}

{% block content %}
<h1>{{ service.name }}</h1>

<h2>Service Details</h2>

<p><strong>Category:</strong> {{ service.category }}</p>

<p>
    <strong>Price:</strong>
    ${{ "%.2f"|format(service.price_cents / 100) }}
</p>

<a href="{{ url_for('book') }}" role="button">
    Book Appointment
</a>

<a href="{{ url_for('services') }}" role="button" class="secondary">
    Back to Services
</a>
{% endblock %}
